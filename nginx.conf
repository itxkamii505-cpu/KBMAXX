# Put this file at /etc/nginx/sites-available/default (vps-deploy.sh does it for you).

# Access log format WITHOUT the query string, so ?token=... never ends up in log files
log_format kbmax '$remote_addr - [$time_local] "$request_method $uri" $status $body_bytes_sent "$http_user_agent"';

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

upstream kbmax_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    access_log /var/log/nginx/kbmax_access.log kbmax;

    client_max_body_size 3M;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # Live SMS stream (Server-Sent Events): no buffering, long timeout
    location = /api/sms/stream {
        proxy_pass http://kbmax_app;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Media upload (up to 55 MB)
    location = /api/upload/media {
        client_max_body_size 55M;
        proxy_pass http://kbmax_app;
        proxy_request_buffering off;
    }

    location / {
        proxy_pass http://kbmax_app;
    }
}

# ---- HTTPS (strongly recommended: logins and tokens travel over this connection) ----
# 1) Point a domain to this server   2) sudo apt install certbot python3-certbot-nginx
# 3) sudo certbot --nginx -d your-domain.com   (certbot edits this file and adds the 443 block + redirect)
